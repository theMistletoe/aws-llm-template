# デプロイ（任意・既定OFF）。ENABLE_CICD=true と、infra の CicdStack が作るOIDCロールのARNを
# リポジトリ変数 AWS_DEPLOY_ROLE_ARN に設定すると有効になる。長期アクセスキーは使わない（§9.6）。
# main へのマージで dev へデプロイ。prod は手動実行＋GitHub Environment の承認を必須にする。
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      stage:
        description: deploy stage
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ inputs.stage || 'dev' }}
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.ENABLE_CICD == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: ${{ inputs.stage || 'dev' }}
    env:
      CHAT_APP_STAGE: ${{ inputs.stage || 'dev' }}
      CHAT_APP_SES_FROM_EMAIL: ${{ vars.SES_FROM_EMAIL }}
      CHAT_APP_ALARM_EMAIL: ${{ vars.ALARM_EMAIL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-1
      - run: pnpm deploy:aws
      - run: pnpm smoke
